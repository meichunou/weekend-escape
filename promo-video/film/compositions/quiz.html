  <script>
    const tl = gsap.timeline({ paused: true });
    // Colour flood: the button's coral settles into the quiz page's peach.
    tl.fromTo("#qz-ground", { backgroundColor: "#FF5C4D" }, { backgroundColor: "#FFD9C2", duration: 0.4, ease: "power2.inOut" }, 0);
    tl.fromTo("#qz-dots", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.1);
    tl.fromTo(".qz-slot-k, .qz-slot", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.3);
    tl.fromTo("#qz-card", { y: 1300, scale: 1.06 }, { y: 0, scale: 1, duration: 0.65, ease: "expo.out" }, 0.12);

    // Tap points inside the card (from capture/taps.json), in frame pixels.
    const taps = [
      { at: 1.43, x: 532, y: 924, shot: "#qz-q1p", st: "#qz-st1", dx: 322, dy: 679 },
      { at: 3.03, x: 532, y: 741, shot: "#qz-q2p", st: "#qz-st2", dx: -8, dy: 496 },
      { at: 4.63, x: 532, y: 924, shot: "#qz-q3p", st: "#qz-st3", dx: -338, dy: 679 },
    ];
    taps.forEach((t, i) => {
      // The finger arrives, presses, lifts.
      tl.fromTo("#qz-finger", { x: t.x + 110, y: t.y + 150, opacity: 0, scale: 1 }, { x: t.x, y: t.y, opacity: 1, duration: 0.38, ease: "power3.out" }, t.at - 0.42);
      tl.to("#qz-finger", { scale: 0.8, duration: 0.05, ease: "power2.in" }, t.at - 0.04);
      tl.set(t.shot, { opacity: 1 }, t.at);
      tl.to("#qz-finger", { scale: 1, opacity: 0, duration: 0.16, ease: "power2.out" }, t.at + 0.04);
      // The picked answer peels off as a sticker and lands in its slot.
      tl.fromTo(t.st, { opacity: 1, x: t.dx, y: t.dy, scale: 1.5, rotation: i % 2 ? 8 : -8 }, { x: 0, y: 0, scale: 1, rotation: i % 2 ? 2 : -2, duration: 0.5, ease: "back.out(1.5)" }, t.at + 0.1);
    });
    // Whip between questions: out with blur, in with blur.
    const swap = (from, to, at) => {
      tl.to(from, { x: -120, opacity: 0, filter: "blur(10px)", duration: 0.13, ease: "power3.in" }, at);
      tl.fromTo(to, { x: 120, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, at + 0.1);
    };
    swap(["#qz-q1", "#qz-q1p"], "#qz-q2", 2.08);
    swap(["#qz-q2", "#qz-q2p"], "#qz-q3", 3.68);
    // The card drops away; the three stickers stay for the match.
    tl.to("#qz-card", { y: 1500, rotation: 4, duration: 0.4, ease: "power3.in" }, 5.25);
    window.__timelines["quiz"] = tl;
  </script>
