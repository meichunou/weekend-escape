    const all = ["lille","brussels","ghent","bruges","strasbourg","cologne","amsterdam","london","barcelona","lisbon","porto","rome","prague","berlin"];
    const plane = ["lisbon","porto","rome","prague"];
    const over = ["bruges","strasbourg","cologne","amsterdam","london","barcelona","berlin"];

    tl.set("#mt-st2", { rotation: 2 }, 0);

    // Prices print in for the train cities.

    // Filter 2: budget. Everything over €150 is stamped out.
    pulse("#mt-st1", 2.75);
    tl.fromTo(s(over), { opacity: 0, scale: 1.8, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.22, ease: "back.out(1.7)", stagger: 0.09 }, 2.9);

    pulse("#mt-st3", 3.55);
    tl.fromTo(["#mt-t-lille", "#mt-t-brussels", "#mt-t-ghent"], { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.2, ease: "expo.out", stagger: 0.08 }, 3.65);
    tl.to(["#mt-r-lille", "#mt-r-ghent"], { opacity: 0.4, duration: 0.2, ease: "none" }, 3.95);
    tl.to("#mt-r-brussels", { backgroundColor: "#FF5C4D", duration: 0.15, ease: "none" }, 4.0);
    tl.fromTo("#mt-match", { opacity: 0, scale: 1.6, rotation: 10 }, { opacity: 1, scale: 1, rotation: 3, duration: 0.3, ease: "back.out(1.7)" }, 4.0);

    // The Brussels row grows into the ticket; the rest of the board blurs away.
    tl.to(["#mt-board", "#mt-title"], { opacity: 0, filter: "blur(15px)", duration: 0.3, ease: "power2.in" }, 4.45);
    tl.fromTo("#mt-ticket", { opacity: 1, x: -250, y: -231, scaleX: 0.5, scaleY: 0.145 }, { opacity: 1, x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 4.4);
    tl.fromTo("#mt-tk-fill", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none" }, 4.8);
    tl.fromTo(["#mt-l1", "#mt-l2", "#mt-l3"], { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out", stagger: 0.1 }, 4.95);
    // The total counts up and lands on the impact.
    tl.fromTo("#mt-sum", { innerText: 0 }, { innerText: 136, snap: { innerText: 1 }, duration: 0.55, ease: "power2.out" }, 5.05);
    tl.fromTo("#mt-tk-total b", { scale: 1.25, transformOrigin: "100% 100%" }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 5.6);
    tl.fromTo("#mt-yours", { opacity: 0, scale: 1.8, rotation: -16 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.3, ease: "back.out(1.7)" }, 5.6);
    tl.fromTo("#mt-note", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 5.1);
